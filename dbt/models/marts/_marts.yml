version: 2

models:
  - name: dim_location
    columns:
      - name: location_key
        data_tests:
          - unique
          - not_null
      - name: location_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: fct_trips
    columns:
      - name: trip_key
        data_tests:
          - unique
          - not_null
      - name: pickup_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: pickup_location_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: dropoff_location_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key